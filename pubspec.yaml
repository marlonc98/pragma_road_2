name: portal_remoto
description: "Busca personajes de Rick and Morty por nombre y muestra su detalle usando la Rick and Morty API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/translate_dictionaries/

flavorizr:
  instructions:
    - assets:download
    - assets:extract
    - android:androidManifest
    - android:flavorizrGradle
    - android:buildGradle
    - flutter:flavors
    - ios:podfile
    - ios:xcconfig
    - ios:buildTargets
    - ios:schema
    - ios:plist
    - ios:launchScreen
    - assets:clean
    - ide:config
  flavors:
    mock:
      app:
        name: "[MOCK] Portal Remoto"
      android:
        applicationId: "com.example.portal_remoto.mock"
      ios:
        bundleId: "com.example.portalRemoto.mock"
    dev:
      app:
        name: "[DEV] Portal Remoto"
      android:
        applicationId: "com.example.portal_remoto.dev"
      ios:
        bundleId: "com.example.portalRemoto.dev"
    prod:
      app:
        name: "Portal Remoto"
      android:
        applicationId: "com.example.portal_remoto"
      ios:
        bundleId: "com.example.portalRemoto"
